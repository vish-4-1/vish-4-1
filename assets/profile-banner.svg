<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180" role="img" aria-labelledby="title description">
  <title id="title">Vishal Kumar — Student Developer</title>
  <desc id="description">A professional profile banner with animated technical skills.</desc>
  <rect width="900" height="180" fill="#0d1117"/>
  <rect x="40" y="32" width="6" height="116" fill="#58a6ff"/>
  <text x="76" y="84" fill="#f0f6fc" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">Vishal Kumar</text>
  <text x="76" y="117" fill="#8b949e" font-family="Arial, Helvetica, sans-serif" font-size="20">Student Developer</text>
  <text x="76" y="147" fill="#58a6ff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">TECHNICAL SKILLS</text>
  <g fill="#c9d1d9" font-family="Arial, Helvetica, sans-serif" font-size="22">
    <text x="290" y="147">C++<animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;0.15;0.17;0.98;0.99;1;1" dur="9s" repeatCount="indefinite"/></text>
    <text x="290" y="147">JavaScript<animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;0.15;0.17;0.32;0.34;0.98;1" dur="9s" repeatCount="indefinite"/></text>
    <text x="290" y="147">Java<animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;0.32;0.34;0.48;0.50;0.65;1" dur="9s" repeatCount="indefinite"/></text>
    <text x="290" y="147">Python<animate attributeName="opacity" values="0;0;0;0;0;0;1" keyTimes="0;0.48;0.50;0.65;0.67;0.82;1" dur="9s" repeatCount="indefinite"/></text>
    <text x="290" y="147">Git and GitHub<animate attributeName="opacity" values="0;0;0;0;0;1;0" keyTimes="0;0.65;0.67;0.82;0.84;0.98;1" dur="9s" repeatCount="indefinite"/></text>
  </g>
</svg>
